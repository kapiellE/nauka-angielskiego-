.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,0) 45%,var(--bg) 100%)}
.hero h1{position:absolute;z-index:1;left:20px;right:20px;bottom:14px;margin:0;font-size:2.4rem;line-height:1.05;color:var(--ink)}
.wrap{padding:8px 20px 28px;max-width:480px;margin:0 auto}
.sub{margin:0 0 18px;font-family:system-ui,sans-serif;font-size:1rem;opacity:.75}
.lvl{display:flex;width:100%;align-items:center;gap:14px;margin:0 0 12px;padding:16px 18px;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:14px;font:600 1.1rem system-ui,sans-serif;text-align:left;cursor:pointer}
.lvl b{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--red);color:#fff;font-size:1.1rem}
.lvl:focus-visible,.ans:focus-visible,.exit:focus-visible{outline:3px solid #2f6fed;outline-offset:2px}
.q{padding:14px 16px;max-width:480px;width:100%;margin:0 auto;flex:1;min-height:0;display:flex;flex-direction:column}
.tag{font:600 .85rem system-ui,sans-serif;opacity:.7;margin:0 0 2px}
.q h2{font-size:1.2rem;margin:0 0 4px}
.word{font-size:2.8rem;margin:2px 0 12px;color:var(--navy)}
.ans{position:relative;display:flex;justify-content:space-between;align-items:center;width:100%;margin:0 0 14px;padding:20px 18px;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:14px;font:600 1.3rem system-ui,sans-serif;cursor:pointer}
.ans.ok{background:var(--okbg);border-color:var(--okbd)}
.ans.bad{background:var(--badbg);border-color:var(--badbd)}
.ans .m{font-size:1.6rem;font-weight:700}
.ans.ok .m{color:var(--okbd)}
.ans.bad .m{color:var(--badbd)}
.ans:disabled{cursor:default}
.exit{display:block;visibility:hidden;width:100%;margin-top:10px;padding:14px;background:var(--navy);color:var(--bg);border:0;border-radius:14px;font:700 1.1rem system-ui,sans-serif;cursor:pointer}
.exit.show{visibility:visible}
#home{background:var(--bg);--bg:#f6f3ee;--ink:#1d2330;--card:#fff;--line:#d9d4ca}
.road{position:relative;width:100%;max-width:360px;margin:12px auto 24px;aspect-ratio:300/860}
.road svg{position:absolute;inset:0;width:100%;height:100%}
.r1{fill:none;stroke:#4a5060;stroke-width:44;stroke-linecap:round;stroke-linejoin:round}
.r2{fill:none;stroke:#fff;stroke-width:3;stroke-dasharray:12 12}
.node{position:absolute;z-index:6;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:0;cursor:pointer;font:700 .95rem system-ui,sans-serif;color:var(--ink)}
.node b{display:grid;place-items:center;width:72px;height:72px;border-radius:50%;background:var(--red);color:#fff;font-size:1.8rem;border:4px solid #fff;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.node span{background:#fff;padding:2px 10px;border-radius:999px}
.node:focus-visible{outline:3px solid #2f6fed;border-radius:12px}
.ans input{flex:1;min-width:0;background:none;border:0;outline:0;font:inherit;color:inherit}
.ans:focus-within{outline:3px solid #2f6fed;outline-offset:2px}
.frame{display:flex;align-items:center;justify-content:center;gap:14px;min-height:76px;margin:0 0 22px;border:3px dashed var(--line);border-radius:14px;font:600 1rem system-ui,sans-serif;opacity:.95}
.frame.ok{background:var(--okbg);border:3px solid var(--okbd)}
.frame.bad{background:var(--badbg);border:3px solid var(--badbd)}
.frame .m{font-size:1.6rem;font-weight:700}
.frame.ok .m{color:var(--okbd)}
.frame.bad .m{color:var(--badbd)}
.blocks{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.blk{position:relative;padding:14px 18px;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:12px;font:600 1.1rem system-ui,sans-serif;cursor:grab;touch-action:none;user-select:none}
.blk.drag{box-shadow:0 8px 18px rgba(0,0,0,.25);cursor:grabbing}
.word:empty{display:none}
.word.speak{display:block;width:100%;font:700 1.2rem system-ui,sans-serif;text-align:center;padding:16px;margin:6px 0 14px;border:2px solid var(--okbd);background:var(--card);border-radius:14px;color:var(--ink)}
.node em{font-style:normal;font-weight:600;font-size:.8rem;background:#fff;padding:1px 8px;border-radius:999px}
.pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:92px;margin:0 0 12px;padding:8px;border:2px dashed var(--line);border-radius:14px}
.chip{position:relative;padding:8px 12px;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:10px;font:600 .95rem system-ui,sans-serif;cursor:grab;touch-action:none;user-select:none}
.chip.drag{z-index:10;box-shadow:0 8px 18px rgba(0,0,0,.25)}
.slots{display:grid;gap:6px;grid-template-rows:repeat(7,minmax(0,44px));align-content:start}
.slot{display:flex;align-items:center;gap:10px;min-height:0;overflow:hidden;padding:0 8px;border:2px dashed var(--line);border-radius:10px;font:600 .95rem system-ui,sans-serif}
.slot i{font-style:normal;width:22px;opacity:.7}
.slot .chip{padding:0 10px;height:calc(100% - 4px)}
.slot .m{margin-left:auto;font-size:1.2rem;font-weight:700}
.slot.ok{background:var(--okbg);border:2px solid var(--okbd)}
.slot.bad{background:var(--badbg);border:2px solid var(--badbd)}
.slot.ok .m{color:var(--okbd)}
.slot.bad .m{color:var(--badbd)}
#quiz.on,#done.on,#schoolScreen.on{display:flex;flex-direction:column;min-height:0;height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:hidden}
#answers{flex:1;min-height:0;display:flex;flex-direction:column}
#answers>*{flex-shrink:0}
#answers>.slots{flex:1 1 0;min-height:0}
#list{flex:1;min-height:0;overflow:auto}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 0 6px}
.meta .streak{margin:0;padding:4px 10px;font-size:.85rem}
.exit:disabled{opacity:.35;cursor:default}
.pbar{position:relative;height:38px;background:var(--line);border-radius:99px;overflow:hidden;margin:0 0 12px}
.pbar i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--okbd);border-radius:99px;transition:width .6s}
.pbar span{position:relative;display:block;text-align:center;line-height:38px;font:700 1.1rem system-ui,sans-serif;color:var(--ink)}
.bar{height:12px;background:var(--line);border-radius:99px;overflow:hidden;margin:0 0 6px}
.bar i{display:block;height:100%;width:0;background:var(--okbd);border-radius:99px;transition:width .3s}
.left{font:600 .9rem system-ui,sans-serif;opacity:.75;margin:0}
.cat{display:block;width:100%;margin:0 0 6px;padding:18px;background:#c8102e;color:#fff;border:3px solid #fff;border-radius:14px;box-shadow:0 4px 0 rgba(0,0,0,.3);font:700 1.2rem system-ui,sans-serif;text-align:center;cursor:pointer}
.cat:focus-visible{outline:3px solid #2f6fed;outline-offset:2px}
.fog{position:fixed;inset:0;z-index:5;pointer-events:none;opacity:0;background:radial-gradient(60% 35% at 15% 25%,#fff 0,transparent 70%),radial-gradient(55% 30% at 85% 15%,#fff 0,transparent 70%),radial-gradient(70% 35% at 50% 70%,#fff 0,transparent 70%),radial-gradient(50% 30% at 10% 90%,#fff 0,transparent 70%),rgba(255,255,255,.6)}
.streak{display:inline-block;margin:0 0 12px;padding:8px 14px;border-radius:999px;background:var(--card);border:2px solid var(--line);font:700 1rem system-ui,sans-serif}
.row{display:flex;gap:10px;align-items:center;margin:0 0 6px;padding:7px 12px;border:2px solid var(--line);border-radius:14px;background:var(--card);font-family:system-ui,sans-serif}
.row.ok{background:var(--okbg);border-color:var(--okbd)}
.row.bad{background:var(--badbg);border-color:var(--badbd)}
.row .m{font-size:1.3rem;font-weight:700}
.row.ok .m{color:var(--okbd)}
.row.bad .m{color:var(--badbd)}
.row small{display:block;margin-top:1px;opacity:.85;font-size:.82rem}
#score{font:700 1.1rem system-ui,sans-serif;margin:0 0 10px}
</style>
</head>
<body>
<section id="home" class="screen on">
  <div class="hero"><h1>Angielski bez stresu</h1></div>
  <div class="wrap">
    <div class="streak" id="streak"></div>
    <p class="sub">Wybierz dowolny poziom. Kolejność nie ma znaczenia.</p>
    <button class="cat" id="schoolBtn">Nauka ze szkoły</button>
    <div class="road">
      <svg viewBox="0 0 300 860" preserveAspectRatio="none" aria-hidden="true"><path class="r1" d="M90 0 L90 70 C90 160 210 150 210 240 C210 330 90 320 90 410 C90 500 210 490 210 580 C210 680 150 740 150 860"/><path class="r2" d="M90 0 L90 70 C90 160 210 150 210 240 C210 330 90 320 90 410 C90 500 210 490 210 580 C210 680 150 740 150 860"/></svg>
      <button class="node" data-l="0" style="left:30%;top:8.1%"><b>1</b><span>Poziom 1</span><em>Kategoria: mieszane</em></button>
      <button class="node" data-l="1" style="left:70%;top:27.9%"><b>2</b><span>Poziom 2</span><em>Kategoria: mieszana</em></button>
      <button class="node" data-l="3" style="left:30%;top:47.7%"><b>3</b><span>Poziom 3</span><em>Kategoria: dni tygodnia</em></button>
      <button class="node" data-l="4" style="left:70%;top:67.4%"><b>4</b><span>Poziom 4</span><em>Kategoria: słuchanie</em></button>
    </div>
    <div class="fog" id="fog"></div>
  </div>
</section>

<section id="quiz" class="screen">
  <div class="q">
    <div class="bar"><i id="barfill"></i></div>
    <div class="meta"><p class="left" id="left"></p><div class="streak" id="streak2"></div></div>
    <p class="tag" id="tag"></p>
    <h2 id="prompt">Co to znaczy po polsku?</h2>
    <div class="word" id="word"></div>
    <div id="answers"></div>
    <button class="exit" id="next">Dalej</button>

  </div>
</section>

<section id="schoolScreen" class="screen">
  <div class="q">
    <h2>Nauka ze szkoły</h2>
    <button class="ans topic" id="homesBtn">Domy / meble</button>
    <button class="exit show" id="schoolBack">Wróć</button>
  </div>
</section>

<section id="done" class="screen">
  <div class="q">
    <h2>Wyniki</h2>
    <div class="pbar"><i id="pfill"></i><span id="ptxt"></span></div>
    <p id="score"></p>
    <div id="list"></div>
    <button class="exit show" id="exit">Wyjdź</button>
  </div>
</section>

<script>
var LEVELS=[
  [
    {word:"Age",opts:["Wiek","Wzrost"],good:0},
    {word:"Fat",opts:["Gruby","Chudy"],good:0},
    {word:"Shirt",opts:["Koszulka","Spodnie"],good:0},
    {word:"Jumper",opts:["Sweter","Skoki"],good:0},
    {word:"Tall",type:true,ans:"wysoki"}
  ],
  [
    {word:"You",opts:["ty","wy"],good:0},
    {word:"Loose",opts:["Spokojny","Luźny"],good:1},
    {word:"Short",drag:true,prompt:"Przeciągnij tłumaczenie do ramki",opts:["Niski","Filmik","Oglądać"],good:0},
    {word:"Dumny",prompt:"Jak to będzie po angielsku?",opts:["Amazed","Proud","Lonely"],good:1},
    {word:"Comfortable",opts:["Wygodny","Amused"],good:0},
    {word:"Shoes",opts:["Buty","Tight"],good:0},
    {word:"Wavy",opts:["Kręcony","Falujący"],good:1}
  ],
  [
    {word:"Cooker",opts:["Kuchnia","Fudge"],good:0},
    {word:"Cottage",opts:["Dom na wsi","Dom w mieście"],good:0}
  ],
  [
    {word:"",order:true,prompt:"Ułóż dni tygodnia od poniedziałku do niedzieli",items:["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"]}
  ],
  [
    {word:"",say:"You",prompt:"Słuchaj i wybierz (stuknij głośnik, by powtórzyć)",opts:["You","We"],good:0},
    {word:"",say:"it",prompt:"Słuchaj i wybierz (stuknij głośnik, by powtórzyć)",opts:["It","Me"],good:0},
    {word:"",say:"we",prompt:"Słuchaj i wybierz (stuknij głośnik, by powtórzyć)",opts:["We","My","Is"],good:0}
  ]
];
var cur=0,qi=0,res=[];
var NAMES=['Poziom 1 (mieszane)','Poziom 2 (mieszana)','Domy / meble','Poziom 3 (dni tygodnia)','Poziom 4 (słuchanie)'];
var home=document.getElementById('home'),done=document.getElementById('done'),quiz=document.getElementById('quiz'),
    box=document.getElementById('answers'),exitBtn=document.getElementById('exit'),nextBtn=document.getElementById('next');

function show(el){home.classList.remove('on');quiz.classList.remove('on');done.classList.remove('on');document.getElementById('schoolScreen').classList.remove('on');el.classList.add('on');window.scrollTo(0,0)}

function open(i){cur=i;qi=0;res=[];ask();show(quiz)}

function ds(d){return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function load(){try{return +localStorage.getItem('good')||0}catch(e){return 0}}
function save(n){try{localStorage.setItem('good',n)}catch(e){}}
function streak(){return load()}
function pickVoice(){
  var vs=speechSynthesis.getVoices();
  var en=vs.filter(function(v){return /^en[-_](US|GB)/i.test(v.lang)});
  var pref=['Samantha','Google US English','Google UK English Female','Daniel','Karen','Aria','Jenny','Natural'];
  for(var i=0;i<pref.length;i++){
    var f=en.filter(function(v){return v.name.indexOf(pref[i])>-1})[0];
    if(f)return f;
  }
  return en[0]||vs.filter(function(v){return /^en/i.test(v.lang)})[0]||null;
}
function noVoice(){document.getElementById('prompt').textContent='Ta przeglądarka nie ma głosu. Otwórz aplikację w Chrome lub Safari.'}
function speak(txt){
  try{
    var s=window.speechSynthesis;if(!s||!window.SpeechSynthesisUtterance){noVoice();return}
    if(s.speaking||s.pending)s.cancel();
    s.resume();
    var u=new SpeechSynthesisUtterance(txt);
    var v=pickVoice();
    if(v){u.voice=v;u.lang=v.lang}else{u.lang='en-US'}
    u.rate=0.8;u.pitch=1;u.volume=1;
    u.onerror=function(e){if(e.error&&e.error!=='canceled'&&e.error!=='interrupted')noVoice()};
    s.speak(u);
  }catch(e){noVoice()}
}
var AC=null;
function beep(ok){
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')AC.resume();
    var t=AC.currentTime;
    var notes=ok?[[660,0,.12,'sine'],[880,.12,.22,'sine']]:[[140,0,.7,'sine']];
    notes.forEach(function(n){
      var o=AC.createOscillator(),g=AC.createGain();
      o.type=n[3];o.frequency.setValueAtTime(n[0],t+n[1]);if(!ok){o.frequency.exponentialRampToValueAtTime(n[0]*3,t+n[1]+.12);var l=AC.createOscillator(),lg=AC.createGain();l.frequency.value=16;lg.gain.value=55;l.connect(lg);lg.connect(o.frequency);l.start(t+n[1]);l.stop(t+n[1]+n[2]+0.05)}
      g.gain.setValueAtTime(0.0001,t+n[1]);
      g.gain.exponentialRampToValueAtTime(ok?0.25:0.4,t+n[1]+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+n[1]+n[2]);
      var f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=ok?8000:1400;o.connect(g);g.connect(f);f.connect(AC.destination);o.start(t+n[1]);o.stop(t+n[1]+n[2]+0.05);
    });
  }catch(e){}
}
function bump(r){save(r?load()+1:0);renderStreak();beep(r)}
function days(n){return n===1?'dzień':'dni'}
function setBar(n){
  var t=LEVELS[cur].length;
  document.getElementById('barfill').style.width=(n/t*100)+'%';
  document.getElementById('left').textContent=n>=t?'Koniec pytań':'Zostało pytań: '+(t-n);
}
function renderStreak(){var t='\uD83D\uDD25 Passa dobrych odpowiedzi: '+streak();document.getElementById('streak').textContent=t;document.getElementById('streak2').textContent=t}

function typed(L){
  var w=document.createElement('div');w.className='ans';w.style.cursor='text';
  var inp=document.createElement('input');inp.placeholder='Wpisz po polsku';
  inp.setAttribute('autocomplete','off');inp.setAttribute('autocapitalize','none');inp.setAttribute('aria-label','Odpowiedź po polsku');
  var m=document.createElement('span');m.className='m';
  w.appendChild(inp);w.appendChild(m);box.appendChild(w);
  var go=document.createElement('button');go.className='exit show';go.textContent='Sprawdź';box.appendChild(go);
  function check(){
    var v=inp.value.trim();if(!v)return;
    var r=v.toLowerCase()===L.ans;
    inp.disabled=true;go.style.display='none';
    w.classList.add(r?'ok':'bad');m.textContent=r?'\u2713':'\u2717';
    bump(r);setBar(qi+1);
    res.push({word:L.word,picked:v,good:L.ans,right:r});
    if(qi<LEVELS[cur].length-1){nextBtn.classList.add('show')}else{setTimeout(results,1200)}
  }
  go.onclick=check;
  inp.onkeydown=function(e){if(e.key==='Enter')check()};
}

function dragQ(L){
  var frame=document.createElement('div');frame.className='frame';frame.textContent='Przeciągnij tutaj';
  var row=document.createElement('div');row.className='blocks';
  var order=L.opts.map(function(t,i){return i}),finished=false;
  for(var i=order.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=order[i];order[i]=order[j];order[j]=t}
  function drop(b,idx){
    if(finished)return;finished=true;
    var r=idx===L.good;
    b.style.transform='';b.style.zIndex='';b.classList.remove('drag');
    frame.textContent='';frame.appendChild(b);
    var m=document.createElement('span');m.className='m';m.textContent=r?'\u2713':'\u2717';frame.appendChild(m);
    frame.classList.add(r?'ok':'bad');
    Array.prototype.forEach.call(row.children,function(x){x.disabled=true});b.disabled=true;
    bump(r);setBar(qi+1);
    res.push({word:L.word,picked:L.opts[idx],good:L.opts[L.good],right:r});
    if(qi<LEVELS[cur].length-1){nextBtn.classList.add('show')}else{setTimeout(results,1200)}
  }
  order.forEach(function(idx){
    var b=document.createElement('button');b.className='blk';b.textContent=L.opts[idx];
    var sx=0,sy=0,moved=false;
    b.onpointerdown=function(e){if(finished)return;sx=e.clientX;sy=e.clientY;moved=false;b.setPointerCapture(e.pointerId);b.classList.add('drag');b.style.zIndex=10;e.preventDefault()};
    b.onpointermove=function(e){if(finished||!b.hasPointerCapture(e.pointerId))return;var dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)+Math.abs(dy)>6)moved=true;b.style.transform='translate('+dx+'px,'+dy+'px)'};
    b.onpointerup=function(e){
      if(finished)return;
      b.classList.remove('drag');b.style.transform='';b.style.zIndex='';
      var r=frame.getBoundingClientRect();
      var inside=e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom;
      if(inside||!moved)drop(b,idx);
    };
    b.onclick=function(e){if(e.detail===0)drop(b,idx)};
    row.appendChild(b);
  });
  box.appendChild(frame);box.appendChild(row);
}

function orderQ(L){
  var n=L.items.length,fill=[],slots=[],finished=false;
  var pool=document.createElement('div');pool.className='pool';
  var list=document.createElement('div');list.className='slots';
  var go=document.createElement('button');go.className='exit show';go.disabled=true;go.textContent='Sprawdź';
  var mix=L.items.slice(),i,j,t;
  do{for(i=mix.length-1;i>0;i--){j=Math.floor(Math.random()*(i+1));t=mix[i];mix[i]=mix[j];mix[j]=t}}while(mix.join()===L.items.join());
  for(var s=0;s<n;s++){
    var d=document.createElement('div');d.className='slot';
    var num=document.createElement('i');num.textContent=(s+1)+'.';
    var m=document.createElement('span');m.className='m';
    d.appendChild(num);d.appendChild(m);list.appendChild(d);slots.push(d);fill.push(null);
  }
  function where(c){return fill.indexOf(c)}
  function refresh(){go.disabled=!fill.every(function(c){return c})}
  function unplace(c){var k=where(c);if(k>=0)fill[k]=null;pool.appendChild(c);refresh()}
  function place(c,si){
    var old=fill[si];
    if(old===c)return;
    var k=where(c);if(k>=0)fill[k]=null;
    if(old)pool.appendChild(old);
    fill[si]=c;slots[si].insertBefore(c,slots[si].querySelector('.m'));refresh();
  }
  function tap(c){
    if(where(c)>=0){unplace(c);return}
    var e=fill.indexOf(null);if(e>=0)place(c,e);
  }
  mix.forEach(function(txt){
    var b=document.createElement('button');b.className='chip';b.textContent=txt;
    var sx=0,sy=0,moved=false;
    b.onpointerdown=function(e){if(finished)return;sx=e.clientX;sy=e.clientY;moved=false;b.setPointerCapture(e.pointerId);b.classList.add('drag');e.preventDefault()};
    b.onpointermove=function(e){if(finished||!b.hasPointerCapture(e.pointerId))return;var dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)+Math.abs(dy)>6)moved=true;b.style.transform='translate('+dx+'px,'+dy+'px)'};
    b.onpointerup=function(e){
      if(finished)return;
      b.classList.remove('drag');b.style.transform='';
      if(!moved){tap(b);return}
      var hit=-1;
      slots.forEach(function(sl,k){var r=sl.getBoundingClientRect();if(e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom)hit=k});
      if(hit>=0)place(b,hit);else if(where(b)>=0)unplace(b);
    };
    b.onclick=function(e){if(e.detail===0&&!finished)tap(b)};
    pool.appendChild(b);
  });
  go.onclick=function(){
    if(finished)return;finished=true;
    var all=true;
    fill.forEach(function(c,k){
      var r=c.textContent===L.items[k];if(!r)all=false;
      slots[k].classList.add(r?'ok':'bad');slots[k].querySelector('.m').textContent=r?'\u2713':'\u2717';
      c.disabled=true;
    });
    go.style.visibility='hidden';
    bump(all);setBar(qi+1);
    res.push({word:'Dni tygodnia',picked:fill.map(function(c){return c.textContent}).join(', '),good:L.items.join(', '),right:all});
    if(qi<LEVELS[cur].length-1){nextBtn.classList.add('show')}else{setTimeout(results,1800)}
  };
  box.appendChild(pool);box.appendChild(list);box.appendChild(go);
}

function results(){
  var list=document.getElementById('list'),ok=0;list.innerHTML='';
  res.forEach(function(x){
    if(x.right)ok++;
    var d=document.createElement('div');d.className='row '+(x.right?'ok':'bad');
    d.innerHTML='<span class="m"></span><div><strong></strong><small></small></div>';
    d.querySelector('.m').textContent=x.right?'\u2713':'\u2717';
    d.querySelector('strong').textContent=x.word;
    d.querySelector('small').textContent=x.right?('Dobrze: '+x.good):('Twoja odpowiedź: '+x.picked+'. Poprawna: '+x.good);
    list.appendChild(d);
  });
  var pct=Math.round(ok/res.length*100);document.getElementById('pfill').style.width=pct+'%';document.getElementById('ptxt').textContent=pct+'%';document.getElementById('score').textContent='Passa dobrych: '+streak();
  show(done);
}

function ask(){
  var L=LEVELS[cur][qi];
  if(!L.type&&!L.drag&&!L.order){
    var c=L.opts[L.good],o=L.opts.slice();
    for(var i=o.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=o[i];o[i]=o[j];o[j]=t}
    L={word:L.word,prompt:L.prompt,say:L.say,opts:o,good:o.indexOf(c)};
  }
  document.getElementById('tag').textContent=NAMES[cur]+', pytanie '+(qi+1)+' z '+LEVELS[cur].length;
  document.getElementById('prompt').textContent=L.prompt||'Co to znaczy po polsku?';
  var wd=document.getElementById('word');wd.className=L.say?'word speak':'word';wd.textContent=L.say?'\uD83D\uDD0A Kliknij i posłuchaj':L.word;
  wd.onclick=L.say?function(){speak(L.say)}:null;wd.style.cursor=L.say?'pointer':'';
  setBar(qi);
  box.innerHTML='';nextBtn.classList.remove('show');
  if(L.order){orderQ(L);return}
  if(L.drag){dragQ(L);return}
  if(L.type){typed(L);return}
  L.opts.forEach(function(t,k){
    var b=document.createElement('button');b.className='ans';
    b.innerHTML='<span></span><span class="m"></span>';
    b.firstChild.textContent=t;
    b.onclick=function(){answer(L,k)};
    box.appendChild(b);
  });
}

function answer(L,picked){
  var btns=box.children;
  for(var k=0;k<btns.length;k++){
    btns[k].disabled=true;
    if(k===picked){var r=picked===L.good;btns[k].classList.add(r?'ok':'bad');btns[k].lastChild.textContent=r?'\u2713':'\u2717'}
  }
  bump(picked===L.good);
  setBar(qi+1);
  res.push({word:L.word||'Słuchanie',picked:L.opts[picked],good:L.opts[L.good],right:picked===L.good});
  if(qi<LEVELS[cur].length-1){nextBtn.classList.add('show')}else{setTimeout(results,1200)}
}

document.querySelectorAll('.node').forEach(function(b){
  b.onclick=function(){open(+b.dataset.l)};
});
exitBtn.onclick=function(){renderStreak();show(home)};
nextBtn.onclick=function(){qi++;ask()};
var fog=document.getElementById('fog');
function mist(){var h=document.querySelector('.hero').offsetHeight||400;fog.style.opacity=Math.min(1,window.scrollY/(h*1.1))*0.88}
window.addEventListener('scroll',mist,{passive:true});mist();
document.getElementById('schoolBtn').onclick=function(){show(document.getElementById('schoolScreen'))};
document.getElementById('schoolBack').onclick=function(){show(home)};
document.getElementById('homesBtn').onclick=function(){open(2)};
renderStreak();
</script>
<script>
